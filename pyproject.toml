[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mayakb"
version = "0.1.0"
description = "Knowledge base: job-based ingestion and hybrid retrieval with a dynamic beam and a reranker"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "numpy>=1.26",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pgvector>=0.3",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "boto3>=1.34",
  "typer>=0.12",
]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
rerank = ["sentence-transformers>=4.0"]
dev = ["pytest>=8", "moto[s3]>=5", "ruff>=0.6"]

[project.scripts]
mayakb = "mayakb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mayakb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "ignore:builtin type [Ss]wig:DeprecationWarning",
]
markers = [
  "postgres: needs MAYAKB_TEST_DATABASE_URL pointing at a throwaway Postgres with pgvector",
  "integration: calls a real external service; gated by environment variables",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
